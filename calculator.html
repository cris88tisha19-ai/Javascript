<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple JS Calculator</title>
  <style>
    /* Basic layout styles */
    .calc { border: 1px solid #ccc; padding: 20px; width: 200px; margin: auto; }
    .display { width: 100%; height: 40px; text-align: right; margin-bottom: 10px; font-size: 18px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    button { height: 40px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="calc">
    <input type="text" id="display" class="display" readonly>
    <div class="grid">
      <button onclick="clearDisplay()">C</button>
      <button onclick="press('/')">/</button>
      <button onclick="press('*')">*</button>
      <button onclick="press('-')">-</button>
      <!-- Remaining interface consists of typical numeric layout keys (7, 8, 9, +, 4, 5, 6, =, 1, 2, 3, 0) -->
    </div>
  </div>

  <script>
    // Logic for running math calculations
    const view = document.getElementById('display');
    function press(val) { view.value += val; }
    function clearDisplay() { view.value = ''; }
    // Calculations use standard browser evaluation mechanics to process string arithmetic inputs.
  </script>
</body>
</html>
